<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <title>Agregar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <div id="val-box" class="oculto">
            <h2 id="val-msg">.</h2>
            <ul id="val-list"></ul>
        </div>
        <form name = "form1" method="post" enctype="multipart/form-data"><br>
            <h2>Datos Estudiante</h2>
            <hr>
            <label for="name">Nombre Estudiante: </label>
            <input type="text" name="name" id="name" minlength="4" maxlength="10"><br>

            <label for="lastname">Apellidos Estudiante: </label>
            <input type="text" name="lastname" id="lastname" minlength="5" maxlength="18"><br>
            
            <label for="rutE">Rut Estudiante: </label>
            <input type="text" name="rutE" id="rutE" placeholder="12.345.678-9" maxlength="12"> <br>

            <label for="fechaNacimiento">Fecha de Nacimiento</label>
            <input type="date" name="fechaNacimiento" id ="fechaNacimiento"><br>

            <h2>Datos Secundarios</h2><hr>

            <label> Tiene Apoderado? :
                <input type="radio" name="rol" value="si"> Si
            </label>
            <label>
                <input type="radio" name="rol" value="no"> No
            </label> <br>

            <span class="oculto">
                <label for="nameA" id="nameALabel" class="oculto">Nombre Apoderado</label>
                <input type="text" name="nameA" id="nameA" minlength="4" maxlength="10" class="oculto">
                <br>
            </span>
            
            <span class="oculto">
                <label for="lastnameA" id="lastnameALabel" class="oculto">Apellidos Apoderado</label>
                <input type="text" name="lastnameA" id="lastnameA" minlength="5" maxlength="18" class="oculto">
                <br>
            </span>

            <span class="oculto">
                <label for="rutA" id="rutALabel" class="oculto">Rut Apoderado</label>
                <input type="text" name="rutA" id="rutA" placeholder="12.345.678-9" maxlength="12" class="oculto">
                <br>
            </span>

            <label for="email" id="labelEmail" class="oculto">Email</label>
            <input type="email" name="email" id="email" minlength="15" class="oculto"><br>

            <label for="phone" id="labelPhone" class="oculto">Teléfono</label>
            <input type="tel" name="phone" id="phone" minlength="9" maxlength="9" class="oculto"> <br>

            <h2>Programa de Entrenamiento</h2><hr>

            <label> Tipo de cinturón:
                <input type="radio" name="claseCinturon" value="tiger"> Cinturón Tiger
            </label>
            <label>
                <input type="radio" name="claseCinturon" value="color"> Cinturón de Color
            </label>
            <label>
                <input type="radio" name="claseCinturon" value="negro"> Cinturón Negro
            </label> <br>

            <span class="bloque oculto">
            <label for="programaRegular" id="labelProgramaBase" class="oculto">Programa Regular:</label>
            <select id="programaRegular" class="oculto">
                <option value="">--Seleccione--</option>
                <option value="tfk">TKD For KIDS</option>
                <option value="adukto">TKD ADULTO</option>
            </select>
            </span><br>

            <span class="bloque oculto">
            <label for="programaEspecial" id="labelProgramaEsp" class="oculto">Programa Especial:</label>
            <select id="programaEspecial" class="oculto">
                <option value="">--Seleccione--</option>
                <option value="nada">NO Aplica</option>
                <option value="leadership">LEADERSHIP</option>
                <option value="legacyS">LEGACY</option>
            </select>
            </span><br>

            <label for="cinturon" id="cinturonLabel">Grado Actual: </label>
            <select id="cinturon">
                <option value="">--Seleccione--</option>
            </select><br>

            <span class="bloque oculto">
                <label for="midterm" id="labelMidterm" class="oculto">Midterm: 
                    <select id="midterm" class="oculto"></select>
                </label>
            </span>

            <h2>Datos Federativos</h2><hr>

            <label for="atanumber">Número ATA: </label>
            <input type="text" name="atanumber" id="atanumber" placeholder="Si no tiene, escriba 0" maxlength="11">
            <br>

            <label for="bekhonumber">Número Bekho: </label>
            <input type="text" name="bekhonumber" id="bekhonumber" placeholder="Si no tiene, escriba 0">
            <br>

            <label> Tamaño del Cinturón:
                <input type="radio" name="size" value="kid">Niño
            </label>
            <label>
                <input type="radio" name="size" value="adult">Adulto
            </label> <br>

            <h2>Restantes Tarea 1</h2><hr>

            <label for="redsocial">Red Social:</label>
            <input type="text" name="redsocial" id="redsocial" placeholder="@usuario">
            <br>
            <label for="archivo">Archivo:</label>
            <input type="file" name="archivo" id="archivo" multiple accept=".jpg,.png,.jpeg">
            <br>
            <span id="archivoMsg" class="bloque oculto"></span>
            

            <br> <br>
            <button id="volverBtn" class="shadow-effect pulse-effect">⬅ Volver</button>  
            <button id="enviarBtn" class="shadow-effect pulse-effect">Enviar</button>

        </form>
    </div>    

    <script src="date.js"></script>
    <script src="validation.js"></script>
    <script src="labelRol.js"></script>
    <script src="select.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='img/bekhoLogoReal.ico') }}">
    <title>{% block title %}{%endblock%}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css')}}">
    {% block extra_css %}{% endblock %}

    <script>
        (function() {
            // Detectar cookie y preferencia del sistema antes de renderizar
            const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            const match = document.cookie.match(/(?:^|;\s*)theme=([^;]+)/);
            const savedTheme = match ? match[1] : null;
            const shouldBeDark = savedTheme === "dark" || (!savedTheme && prefersDark);
            if (shouldBeDark) {
                document.documentElement.style.background = "#121212"; // evitar flash blanco
                document.write('<body class="dark-mode">');
            } else {
                document.documentElement.style.background = "#f5f5f5";
                document.write('<body>');
            }
        })();
    </script>
</head>

{% if request.endpoint != 'estudiante' %}
    <div class="navbar-container fade-in">
        <div class="navbar">
            <div class="navbar-links">
                <a class="navbar-page {% if request.endpoint == 'index' %}active{% endif %}" href="{{ url_for('index') }}">Inicio 🏠</a>
                <a class="navbar-page {% if request.endpoint == 'listado' %}active{% endif %}" href="{{ url_for('listado') }}">Listado 📋</a>
                <a class="navbar-page {% if request.endpoint == 'agregar' %}active{% endif %}" href="{{ url_for('agregar') }}">Agregar ➕</a>
                <a class="navbar-page {% if request.endpoint == 'estadisticas' %}active{% endif %}" href="{{ url_for('estadisticas') }}">Estadísticas 📊</a>
            </div>
        </div>
        <div class="navbar-logo">
            <img src="{{ url_for('static', filename='img/bekhoLogo.png') }}" alt="Logo Bekho">
        </div>
    </div>
{% endif %}

<main>
    {% block content %}{% endblock %}
</main>

<footer class="footer">
    <div class="dark-mode-toggle-wrapper fade-in">
        <button id="darkModeToggle" class="dark-mode-circle">🌞</button>
    </div>
</footer>

<script src="{{ url_for('static', filename='js/darkmode.js') }}"></script>
{% block javascript %}{% endblock %}
</body>
</html>

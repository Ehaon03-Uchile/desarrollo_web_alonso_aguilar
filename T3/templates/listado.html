{% extends 'base.html' %}
{% block title %}Listado{% endblock %}

{% block content %}
<h2 class="section-title slide-in">Listado de Estudiantes</h2>

<div class="controls">
  <input type="text" id="searchInput" placeholder="Buscar por nombre, RUT o correo..." class="input-busqueda">
  
  <select id="sortSelect" class="input-orden">
    <option value="name-asc">Nombre ↑</option>
    <option value="name-desc">Nombre ↓</option>
    <option value="rut-asc">RUT ↑</option>
    <option value="rut-desc">RUT ↓</option>
    <option value="birth_date-asc">Fecha de Nacimiento ↑</option>
    <option value="birth_date-desc">Fecha de Nacimiento ↓</option>
  </select>
</div>

<table id="tabla2" class="tablaClickeable">
  <thead>
    <tr>
      <th>#</th> 
      <th>Nombre Completo</th>
      <th>Fecha de Nacimiento</th>
      <th>Correo</th>
      <th>Número</th>
      <th>Cinturón</th>
      <th>Programa Regular</th>
      <th>Programa Especial</th>
    </tr>
  </thead>
  <tbody id="tabla-body">
    <tr><td colspan="8">Cargando datos...</td></tr>
  </tbody>
</table>

<div class="pagination" id="pagination"></div>
{% endblock %}

{% block javascript %}
<script src="{{ url_for('static', filename='js/listado.js') }}"></script>
{% endblock %}
